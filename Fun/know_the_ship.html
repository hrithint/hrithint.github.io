<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Know the ship? | Navculus.in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a0e9ff;
            --accent: #ffd966;
            --bg-dark: #071a3b;
            --glass-bg: rgba(7, 26, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f0f4f8;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }
        
        /* UI Overlay - Top Bar */
        .header {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 32px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .site-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--primary), #6cb2eb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .page-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-name span {
            font-size: 1.4rem;
        }
        
        .score-area {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .score-area:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
        
        .score-label {
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        #scoreValue {
            color: var(--accent);
            font-size: 1.4rem;
            font-weight: 800;
            font-family: 'Poppins', sans-serif;
        }
        
        /* Central Interactive Word Card */
        .word-card {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 32px;
            border-radius: 24px;
            text-align: center;
            z-index: 100;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            min-width: 260px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .prompt-label {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 2px;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        
        .current-word {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 4px 0;
            background: linear-gradient(180deg, #fff 0%, #cbd5e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        
        .feedback {
            font-size: 0.85rem;
            min-height: 38px;
            line-height: 1.4;
            color: #cbd5e0;
            margin-top: 8px;
            font-weight: 400;
        }
        
        .feedback b {
            color: var(--accent);
        }
        
        .instruction {
            position: absolute;
            top: 100px;
            right: 24px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            z-index: 50;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        
        .controls-hint {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        button {
            background: linear-gradient(135deg, rgba(160, 233, 255, 0.2), rgba(160, 233, 255, 0.1));
            border: 1px solid rgba(160, 233, 255, 0.3);
            color: var(--primary);
            border-radius: 12px;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            margin-top: 16px;
        }
        
        button:hover {
            background: rgba(160, 233, 255, 0.3);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(160, 233, 255, 0.2);
        }

        button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 768px) {
            .header { padding: 8px 20px; top: 16px; left: 16px; right: 16px; flex-direction: column; gap: 8px; border-radius: 24px; }
            .page-name { font-size: 1rem; }
            .current-word { font-size: 2rem; }
            .word-card { width: calc(100% - 64px); padding: 20px; bottom: 24px; min-width: unset; }
            .instruction { display: none; }
        }
        
        /* Elegant Loading Screen */
        #loading-msg {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .loader-content {
            text-align: center;
        }

        .ship-icon {
            font-size: 4rem;
            margin-bottom: 24px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        #loading-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        #loading-subtext {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        /* Debug Panel Styling */
        #debug-panel {
            position: absolute;
            top: 100px;
            left: 24px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: #4ade80;
            padding: 16px;
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            z-index: 200;
            width: 280px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(74, 222, 128, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
        }

        #debug-panel::-webkit-scrollbar {
            width: 4px;
        }

        #debug-panel::-webkit-scrollbar-thumb {
            background: rgba(74, 222, 128, 0.3);
            border-radius: 10px;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(74, 222, 128, 0.2);
        }

        .debug-title {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="site-title">navculus.in</div>
        <div class="page-name"><span>⚓</span> KNOW THE SHIP?</div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button id="toggleDebug" style="margin: 0; padding: 6px 12px; font-size: 0.7rem;">Debug</button>
            <div class="score-area">
                <span class="score-label">Score</span>
                <span id="scoreValue">0</span>
            </div>
        </div>
    </div>

    <div class="word-card" id="wordCard">
        <div class="prompt-label">Identify the Part</div>
        <div class="current-word" id="currentWordLabel">...</div>
        <div class="feedback" id="feedbackMsg">Explore the 3D model and select the correct component</div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 16px;">
            <button id="hintBtn" style="margin-top: 0;">Show Hint</button>
            <button id="skipBtn" style="margin-top: 0;">Skip Part</button>
        </div>
    </div>
    
    <div class="instruction">
        <div class="controls-hint">
            <span>🖱️ <b>Rotate:</b> Left Click + Drag</span>
            <span>🖐️ <b>Pan:</b> Right Click + Drag</span>
            <span>🔍 <b>Zoom:</b> Scroll Wheel</span>
        </div>
    </div>
    
    <div id="loading-msg">
        <div class="loader-content">
            <span class="ship-icon">🚢</span>
            <div id="loading-text">Preparing Vessel</div>
            <div id="loading-subtext">Calibrating 3D Engine...</div>
            <button id="demoBtn" style="display:none; margin: 24px auto 0;">Use Simulation Model</button>
        </div>
    </div>

    <!-- Debug Panel -->
    <div id="debug-panel">
        <div class="debug-header">
            <span class="debug-title">Diagnostics</span>
            <div style="display: flex; gap: 8px;">
                <button id="refreshModel" style="margin:0; padding:4px 8px; font-size:9px;">Reload</button>
                <button id="closeDebug" style="margin:0; padding:4px 8px; font-size:9px;">Hide</button>
            </div>
        </div>
        <div id="debug-info" style="color: var(--accent); margin-bottom: 8px;">Initial scan...</div>
        <div id="debug-list"></div>
    </div>

    <!-- Import Three.js core and add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // ----- Setup Scene, Camera, Renderer -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x071a3b); // deep ocean blue
        scene.fog = new THREE.FogExp2(0x071a3b, 0.008); // subtle fog for depth
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 5, 12);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // shadows add depth
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        // ----- Controls -----
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 1.5, 0);
        
        // ----- Lighting (enhance materials/colors) -----
        // Increase intensity for heavy models
        const ambientLight = new THREE.AmbientLight(0x606080, 1.0);
        scene.add(ambientLight);
        // Main directional light
        const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        // Fill light from below
        const fillLight = new THREE.PointLight(0x4466cc, 0.5);
        fillLight.position.set(0, -2, 0);
        scene.add(fillLight);
        // Back rim light
        const rimLight = new THREE.PointLight(0xffaa66, 0.6);
        rimLight.position.set(-3, 3, -5);
        scene.add(rimLight);
        // Additional warm fill
        const warmFill = new THREE.PointLight(0xffaa66, 0.4);
        warmFill.position.set(2, 3, 4);
        scene.add(warmFill);
        
        // Optional: subtle grid helper on the floor for reference
        const gridHelper = new THREE.GridHelper(20, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -1.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // Simple water-like reflection plane (transparent, just ambiance)
        const waterPlaneMat = new THREE.MeshStandardMaterial({ color: 0x2a6f8f, roughness: 0.4, metalness: 0.7, transparent: true, opacity: 0.25 });
        const waterPlane = new THREE.Mesh(new THREE.PlaneGeometry(14, 12), waterPlaneMat);
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = -1.3;
        scene.add(waterPlane);
        
        // ----- Ship Model Loading (.3dm using Rhino3dmLoader) -----
        let shipGroup = null;          // Will hold the loaded model
        let raycaster = new THREE.Raycaster();
        const clickableObjects = [];   // Store meshes that are part of the ship for raycasting
        
        // Word Game Logic
        const shipPartsData = {
            "Bulbous Bow": "A protruding volume at the front of the hull below the waterline that modifies the water flow to reduce drag and improve fuel efficiency.",
            "Forecastle Deck": "Often called the \"fo'c'sle,\" this is the raised forward section of the deck that provides extra buoyancy and keeps the bow from being easily submerged in heavy seas.",
            "Anchor": "A heavy metal device used to grip the seabed and hold the vessel in a specific position.",
            "Chock": "A stationary, mounted fitting on a ship's deck that guides ropes or cables",
            "Bow": "Foremost part of a ship or boat",
            "Windlass": "The specialized horizontal or vertical machinery used to lower and heave the anchor and its heavy chain.",
            "Bollard": "A short, thick vertical post on the deck used for securing mooring lines to a pier or another vessel.",
            "Fairlead": "A deck fitting, often with rollers, designed to guide mooring lines and minimize friction and wear as they lead off the ship.",
            "Foremast": "The mast located in the forward part of the vessel, typically supporting navigation lights and signaling equipment.",
            "Hatch Cover": "Large, weather-tight steel panels that seal the openings to the cargo holds to protect the cargo from water ingress.",
            "Hatch Coaming": "The raised vertical steel plating around a hatch opening that acts as a frame for the cover and prevents deck water from entering the hold.",
            "Main Deck": "The primary, continuous weather-tight deck of a ship that is exposed to the elements.",
            "Bulwark": "An extension of the ship's side plating above the deck level that acts as a protective barrier for the crew and equipment.",
            "Deck Crane": "A pedestal-mounted mechanical device used to load and unload cargo, allowing the vessel to operate in ports without shore-based infrastructure.",
            "Crane Jib": "Also known as the boom, this is the long structural arm of the crane that extends out to reach cargo.",
            "Propeller": "The rotating fan-like mechanism at the stern that converts engine power into thrust to move the ship through water.",
            "Rudder": "A primary steering surface, usually located behind the propeller, used to control the vessel's direction.",
            "Transom Stern": "A stern design that ends in a flat or slightly curved vertical plane, providing more deck area and simplified construction.",
            "Superstructure": "The part of the ship’s structure that is built above the main deck, housing the living quarters and command center.",
            "Bridge": "The elevated room or platform from which the ship is navigated and steered.",
            "Bridge Wing": "Extensions on both sides of the bridge that allow officers to see down the side of the ship during docking maneuvers.",
            "Funnel": "The chimney or stack on a ship used to discharge smoke and exhaust gases from the main engines and boilers.",
            "Lifeboat": "A small, sturdy craft kept on board for emergency evacuation, typically housed in a launch system called a davit.",
            "Davit": "A specialized crane system used specifically for supporting, lowering, and stowing lifeboats and life rafts.",
            "Aft mast": "The mast situated nearest to the back of the vessel",
            "Bilge keel": "A passive stabilizing device fitted externally to a ship's hull at the turn of the bilge",
            "Bow Thrusters": "Small propellers located at the sides of the bow to help the ship maneuver sideways in tight spaces",
            "Capstan": "A vertical motorized winch used for winding up heavy ropes and anchor chains.",
            "Fender": "A cushioned bumper hung over the side of a ship to protect the hull from hitting docks or other vessels.",
            "Manhole": "A watertight opening that provides access into tanks or small void spaces for inspection.",
            "Liferaft": "An inflatable or rigid survival craft stowed in a protective canister on a ship's deck"
        };

        const shipPartsVocabulary = Object.keys(shipPartsData);
        
        let currentWord = "";
        let currentScore = 0;
        let canSelect = true;          // prevent double clicking same word before next
        let isLoading = true;
        
        const scoreSpan = document.getElementById("scoreValue");
        const wordLabel = document.getElementById("currentWordLabel");
        const feedbackDiv = document.getElementById("feedbackMsg");
        const skipBtn = document.getElementById("skipBtn");
        const hintBtn = document.getElementById("hintBtn");
        
        // Helper: get random word distinct from current? For better experience just random
        function getRandomWord() {
            const randomIndex = Math.floor(Math.random() * shipPartsVocabulary.length);
            return shipPartsVocabulary[randomIndex];
        }
        
        function setNewWord() {
            let newWord = getRandomWord();
            // Avoid same word repeatedly if possible, not mandatory but smoother
            while (newWord === currentWord && shipPartsVocabulary.length > 1) {
                newWord = getRandomWord();
            }
            currentWord = newWord;
            wordLabel.textContent = currentWord;
            feedbackDiv.innerHTML = "🔎 Tap/click on that part of the ship!";
            canSelect = true;
            // reset any temporary highlight if needed (we do not auto highlight, user must identify)
        }
        
        function updateScoreUI() {
            scoreSpan.textContent = currentScore;
        }
        
        function handleCorrectSelection(partName) {
            if (!canSelect) return false;
            if (partName.toLowerCase() === currentWord.toLowerCase()) {
                currentScore++;
                updateScoreUI();
                const definition = shipPartsData[currentWord] || "Great job identifying this part!";
                feedbackDiv.innerHTML = `<b style="color:#fff">✅ ${currentWord}:</b> ${definition}`;
                canSelect = false;
                // play subtle visual flash (word card)
                const card = document.getElementById("wordCard");
                card.style.transform = "translateX(-50%) scale(1.02)";
                setTimeout(() => { card.style.transform = "translateX(-50%) scale(1)"; }, 200);
                // move to next word after brief pause
                setTimeout(() => {
                    setNewWord();
                }, 2500); // Increased delay to allow reading the definition
                return true;
            } else {
                feedbackDiv.innerHTML = `❌ Not "${currentWord}". That's the ${partName}. Try again!`;
                // flash red briefly
                feedbackDiv.style.color = "#ffaaaa";
                setTimeout(() => { feedbackDiv.style.color = "#aaffcc"; }, 500);
                return false;
            }
        }
        
        // skip button: force next word (no penalty)
        skipBtn.addEventListener("click", () => {
            if (!isLoading) {
                setNewWord();
                feedbackDiv.innerHTML = "⏩ Skipped! Try the new word.";
                canSelect = true;
            }
        });

        // hint button: show definition
        hintBtn.addEventListener("click", () => {
            if (!isLoading && canSelect) {
                const definition = shipPartsData[currentWord];
                feedbackDiv.innerHTML = `💡 <b>Hint:</b> ${definition}`;
            }
        });

        // Debug panel toggle
        document.getElementById("toggleDebug").onclick = () => {
            const panel = document.getElementById("debug-panel");
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        };

        // Debug panel close
        document.getElementById("closeDebug").onclick = () => {
            document.getElementById("debug-panel").style.display = 'none';
        };

        // Force Reload logic
        document.getElementById("refreshModel").onclick = () => {
            window.location.href = window.location.pathname + '?refresh=' + new Date().getTime();
        };
        
        // ----- Model Loading with GLTFLoader -----
        const loader = new GLTFLoader();
        
        const loadingScreen = document.getElementById("loading-msg");
        const loadingText = document.getElementById("loading-text");
        const loadingSubtext = document.getElementById("loading-subtext");
        const demoBtn = document.getElementById("demoBtn");
        let loadingTimeout;

        // Add a check for file protocol (CORS issue)
        if (window.location.protocol === 'file:') {
            if (loadingText) {
                loadingText.innerHTML = "Local File Blocked";
                loadingSubtext.innerHTML = "Browsers block 3D files for security when opened directly.";
                demoBtn.style.display = "block";
                demoBtn.innerHTML = "Use Demo Ship";
                demoBtn.onclick = () => triggerFallback("Protocol blocked");
            }
        } else {
            // Show fallback button after 8 seconds of silence
            loadingTimeout = setTimeout(() => {
                if (isLoading && loadingText) {
                    demoBtn.style.display = "block";
                    demoBtn.innerHTML = "Model taking too long? Use Demo Ship";
                    demoBtn.onclick = () => triggerFallback("User timeout");
                }
            }, 8000);
        }

        function triggerFallback(reason) {
            console.warn("Fallback triggered:", reason);
            if (loadingText) {
                loadingText.innerHTML = "Simulation Mode";
                loadingSubtext.innerHTML = reason;
                demoBtn.style.display = "none";
            }
            // Transition to fallback
            setTimeout(() => {
                fadeOutLoading();
                const fallback = createFallbackShip();
                shipGroup = fallback;
                shipGroup.traverse((child) => {
                    if (child.isMesh && child.userData.partName) {
                        child.castShadow = true;
                        clickableObjects.push(child);
                    }
                });
                scene.add(shipGroup);
                isLoading = false;
                setNewWord();
                controls.target.set(0, 1.5, 0);
            }, 4000);
        }

        function fadeOutLoading() {
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 800);
            }
        }

        // Try loading the actual .glb file
        const urlParams = new URLSearchParams(window.location.search);
        const modelPath = urlParams.has('refresh') ? `Ship_model.glb?v=${urlParams.get('refresh')}` : 'Ship_model.glb';
        
        if (loadingText) {
            loadingText.innerHTML = "Initializing Vessel";
            loadingSubtext.innerHTML = "Loading GLB Geometry...";
        }
        
        loader.load(modelPath, 
            (gltf) => {
                if (!isLoading) return;
                clearTimeout(loadingTimeout);
                console.log('GLB model loaded successfully');
                fadeOutLoading();
                
                shipGroup = gltf.scene;
                
                // Optimize materials for faster rendering
                shipGroup.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.side = THREE.FrontSide;
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                const debugInfo = document.getElementById("debug-info");
                const debugList = document.getElementById("debug-list");
                debugInfo.innerHTML = "Model Loaded. Scanning meshes...";
                debugList.innerHTML = "";

                // --- AUTO-SCALE AND CENTER LOGIC ---
                const box = new THREE.Box3().setFromObject(shipGroup);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                // Rescale to fit within a 12x12x12 cube
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 12 / maxDim;
                shipGroup.scale.setScalar(scale);
                
                // Re-center model at origin
                shipGroup.position.x = -center.x * scale;
                shipGroup.position.y = -center.y * scale; 
                shipGroup.position.z = -center.z * scale;

                let matchCount = 0;
                let totalMeshes = 0;

                shipGroup.traverse((child) => {
                    if (child.isMesh) {
                        totalMeshes++;
                        
                        // --- ADVANCED PART IDENTIFICATION ---
                        const meshName = (child.name || "").toLowerCase().trim();
                        const matName = (child.material && child.material.name) ? child.material.name.toLowerCase().trim() : "";
                        const combinedSearch = (meshName + " " + matName).replace(/[_-]/g, ' ');

                        let matchedPart = null;
                        for (let part of shipPartsVocabulary) {
                            const partKeywords = part.toLowerCase().split(' ');
                            if (combinedSearch.includes(part.toLowerCase()) || 
                                (partKeywords.length > 1 && partKeywords.every(kw => combinedSearch.includes(kw)))) {
                                matchedPart = part;
                                break;
                            }
                        }

                        if (matchedPart) {
                            child.userData.partName = matchedPart;
                            clickableObjects.push(child);
                            matchCount++;
                            
                            const entry = document.createElement("div");
                            entry.style.color = "#44ff44";
                            entry.style.borderBottom = "1px solid #224422";
                            entry.style.padding = "2px 0";
                            entry.innerHTML = `✅ <b>${matchedPart}</b> <br><small style="color:#88ff88">ID: ${child.name || 'unnamed'}</small>`;
                            debugList.appendChild(entry);
                        } else {
                            const entry = document.createElement("div");
                            entry.style.color = "#aaaaaa";
                            entry.style.borderBottom = "1px solid #333";
                            entry.style.padding = "2px 0";
                            entry.innerHTML = `⚪ No match: <small>${child.name || 'unnamed'}</small>`;
                            debugList.appendChild(entry);
                        }
                    }
                });

                debugInfo.innerHTML = `Found ${matchCount} matches in ${totalMeshes} meshes.`;
                if (matchCount === 0) {
                    debugInfo.innerHTML += "<br><span style='color:red'>⚠️ No parts identified! Rename objects in your 3D software.</span>";
                }

                scene.add(shipGroup);
                isLoading = false;
                setNewWord();
                controls.target.set(0, 0, 0);
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                    if (loadingText) loadingText.innerHTML = `🌊 Loading Ship Model: ${percent}%`;
                    if (loadingSubtext) loadingSubtext.innerHTML = `${Math.round(xhr.loaded/1024/1024*10)/10} MB / ${Math.round(xhr.total/1024/1024*10)/10} MB`;
                } else {
                    if (loadingText) loadingText.innerHTML = `🌊 Downloading...`;
                    if (loadingSubtext) loadingSubtext.innerHTML = `${Math.round(xhr.loaded/1024/1024*10)/10} MB received`;
                }
            },
            (error) => {
                console.error('Error loading .glb', error);
                if (isLoading) {
                    let msg = "Unknown error";
                    if (error && error.message) msg = error.message;
                    else if (typeof error === 'string') msg = error;
                    else if (error && error.target && error.target.status) msg = "HTTP " + error.target.status;
                    
                    triggerFallback("Load error: " + msg);
                }
            }
        );
        
        // Also provide fallback ship generator
        function createFallbackShip() {
            console.warn("Using fallback ship model (procedural) because .3dm couldn't load.");
            const group = new THREE.Group();
            
            // Hull
            const hullGeo = new THREE.BoxGeometry(3.2, 1.2, 6);
            const hullMat = new THREE.MeshStandardMaterial({ color: 0xbc9a6c, roughness: 0.4, metalness: 0.7 });
            const hull = new THREE.Mesh(hullGeo, hullMat);
            hull.position.y = 0;
            hull.castShadow = true;
            hull.receiveShadow = true;
            hull.userData = { partName: "Hull" };
            group.add(hull);
            
            // Bow shape (simple cone)
            const bowGeo = new THREE.ConeGeometry(0.9, 1.8, 16);
            const bowMat = new THREE.MeshStandardMaterial({ color: 0xbf8f5c });
            const bow = new THREE.Mesh(bowGeo, bowMat);
            bow.position.set(0, 0.3, 3.0);
            bow.rotation.x = 0;
            bow.userData = { partName: "Bow" };
            group.add(bow);
            
            // Stern decoration (small box)
            const sternGeo = new THREE.BoxGeometry(1.4, 0.8, 1.2);
            const sternMat = new THREE.MeshStandardMaterial({ color: 0xab7b4a });
            const stern = new THREE.Mesh(sternGeo, sternMat);
            stern.position.set(0, 0.2, -2.9);
            stern.userData = { partName: "Stern" };
            group.add(stern);
            
            // Mast (main)
            const mastGeo = new THREE.CylinderGeometry(0.25, 0.4, 3.2, 8);
            const mastMat = new THREE.MeshStandardMaterial({ color: 0xc0a080 });
            const mast = new THREE.Mesh(mastGeo, mastMat);
            mast.position.set(0, 1.5, 0.5);
            mast.userData = { partName: "Mast" };
            group.add(mast);
            
            // Deck (thin plate)
            const deckGeo = new THREE.BoxGeometry(2.8, 0.15, 5.2);
            const deckMat = new THREE.MeshStandardMaterial({ color: 0xd8b48c, roughness: 0.6 });
            const deck = new THREE.Mesh(deckGeo, deckMat);
            deck.position.set(0, 0.7, 0);
            deck.userData = { partName: "Deck" };
            group.add(deck);
            
            // Rudder
            const rudderGeo = new THREE.BoxGeometry(0.5, 1.0, 0.2);
            const rudderMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const rudder = new THREE.Mesh(rudderGeo, rudderMat);
            rudder.position.set(0, -0.2, -2.4);
            rudder.userData = { partName: "Rudder" };
            group.add(rudder);
            
            // Anchor on bow side
            const anchorGeo = new THREE.TorusGeometry(0.3, 0.08, 12, 30);
            const anchorMat = new THREE.MeshStandardMaterial({ color: 0xccaa77, metalness: 0.8 });
            const anchorRing = new THREE.Mesh(anchorGeo, anchorMat);
            anchorRing.position.set(0.9, 0.2, 3.1);
            anchorRing.rotation.z = Math.PI / 2;
            anchorRing.userData = { partName: "Anchor" };
            group.add(anchorRing);
            
            // Propeller
            const propGroup = new THREE.Group();
            const bladeGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
            const propMat = new THREE.MeshStandardMaterial({ color: 0xbb9966 });
            const blade1 = new THREE.Mesh(bladeGeo, propMat);
            blade1.position.set(0.6, 0, 0);
            const blade2 = new THREE.Mesh(bladeGeo, propMat);
            blade2.position.set(-0.6, 0, 0);
            const center = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), propMat);
            propGroup.add(blade1, blade2, center);
            propGroup.position.set(0, -0.5, -3.2);
            propGroup.userData = { partName: "Propeller" };
            group.add(propGroup);
            
            // Funnel (smokestack)
            const funnelGeo = new THREE.CylinderGeometry(0.55, 0.65, 1.4, 12);
            const funnelMat = new THREE.MeshStandardMaterial({ color: 0xbd5a3a });
            const funnel = new THREE.Mesh(funnelGeo, funnelMat);
            funnel.position.set(0.8, 1.2, -1.4);
            funnel.userData = { partName: "Funnel" };
            group.add(funnel);
            
            // Bridge (superstructure)
            const bridgeGeo = new THREE.BoxGeometry(1.4, 0.8, 1.2);
            const bridgeMat = new THREE.MeshStandardMaterial({ color: 0xbc9e6f });
            const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
            bridge.position.set(0, 1.1, -1.8);
            bridge.userData = { partName: "Bridge" };
            group.add(bridge);
            
            // Cabin
            const cabinGeo = new THREE.BoxGeometry(1.2, 0.8, 1.4);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0xc8aa7a });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(-0.9, 1.0, 0.2);
            cabin.userData = { partName: "Cabin" };
            group.add(cabin);
            
            // Keel extra (visual)
            const keelGeo = new THREE.BoxGeometry(0.4, 0.2, 5.5);
            const keelMat = new THREE.MeshStandardMaterial({ color: 0x8b5d34 });
            const keel = new THREE.Mesh(keelGeo, keelMat);
            keel.position.set(0, -0.7, 0);
            keel.userData = { partName: "Keel" };
            group.add(keel);
            
            return group;
        }
        
        // ----- Raycaster Interaction (click selection) -----
        window.addEventListener('mousedown', (event) => {
            if (isLoading || !canSelect) return;
            
            // Ignore clicks on UI buttons
            if (event.target.tagName === 'BUTTON') return;

            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Search the entire ship model recursively
            const intersects = raycaster.intersectObject(shipGroup, true);
            
            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                let identifiedPart = null;

                // Traverse up to find a part name assigned during load
                let current = hitObject;
                while (current && current !== scene) {
                    if (current.userData && current.userData.partName) {
                        identifiedPart = current.userData.partName;
                        break;
                    }
                    current = current.parent;
                }

                if (identifiedPart) {
                    const isCorrect = handleCorrectSelection(identifiedPart);
                    
                    // Highlight ONLY if correct
                    if (isCorrect) {
                        const highlightColor = new THREE.Color(0x00ff00);
                        
                        // Highlight ALL meshes that share this part name
                        shipGroup.traverse((child) => {
                            if (child.isMesh && child.userData && child.userData.partName === identifiedPart) {
                                if (child.material) {
                                    // Store original material reference
                                    const originalMaterial = child.material;
                                    
                                    // Clone material to avoid affecting other meshes sharing the same material
                                    child.material = originalMaterial.clone();
                                    child.material.emissive.copy(highlightColor);
                                    child.material.emissiveIntensity = 1.0;

                                    // Reset back to original material after a short delay
                                    setTimeout(() => {
                                        child.material = originalMaterial;
                                    }, 600);
                                }
                            }
                        });
                    }
                } else {
                    // Clean up the CAD name for display
                    let cleanName = hitObject.name || "Unknown Part";
                    cleanName = cleanName.replace(/[_-]/g, ' ')
                                         .replace(/[0-9]/g, '')
                                         .replace(/mesh|layer|object/gi, '')
                                         .trim();
                    
                    if (cleanName.length < 2) cleanName = "Unnamed Ship Part";

                    feedbackDiv.innerHTML = `📍 That's the <b>${cleanName}</b>.<br>It's not in the quiz list! Try another part.`;
                    feedbackDiv.style.color = "#ffd966";
                    
                    // Removed highlight for unnamed parts as requested
                }
            } else {
                feedbackDiv.innerHTML = "🌊 You clicked the ocean! Look closer at the ship.";
                feedbackDiv.style.color = "#88aaff";
            }
        });
        
        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // update orbit
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Slight stars effect (cosmetic)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100 + 20;
            starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 80;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMat);
        scene.add(stars);
        
    </script>
</body>
