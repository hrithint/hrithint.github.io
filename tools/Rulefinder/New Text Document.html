<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navculus Rulefinder | Local WebLLM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --navculus-green: #10b981; --bg-blue: #f1f4f9; }
        body { background: var(--bg-blue); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .main-container { display: flex; flex: 1; overflow: hidden; padding: 1rem; gap: 1rem; }
        .sidebar { width: 320px; background: white; border-radius: 20px; padding: 1rem; display: flex; flex-direction: column; border: 1px solid #e2e8f0; }
        .chat-area { flex: 1; background: white; border-radius: 20px; display: flex; flex-direction: column; border: 1px solid #e2e8f0; overflow: hidden; }
        #chatWindow { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background: #f8fafc; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; }
        .user-message { align-self: flex-end; background: var(--navculus-green); color: white; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background: white; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .progress-container { margin-bottom: 10px; font-size: 0.8rem; display: none; }
        .progress-bar { height: 6px; background: #eee; border-radius: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--navculus-green); width: 0%; transition: width 0.3s; }
        .btn { background: var(--navculus-green); color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; width: 100%; margin-bottom: 10px; }
        .btn:disabled { background: #cbd5e1; }
        .doc-item { padding: 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 0.85rem; }
        .doc-item.active { background: #f0fdf4; border-left: 4px solid var(--navculus-green); }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin: 0;">Navculus <span style="color:var(--navculus-green)">Rulefinder</span> (WebLLM)</h2>
    <div id="engineStatus" style="font-size: 0.85rem; font-weight: 600; color: #64748b;">System Initializing...</div>
</div>

<div class="main-container">
    <div class="sidebar">
        <div id="loaderUI" class="progress-container">
            <div id="loadMsg">Downloading Model...</div>
            <div class="progress-bar"><div id="loadFill" class="progress-fill"></div></div>
        </div>
        
        <button id="initBtn" class="btn" onclick="initializeAI()">Initialize Local AI Engine</button>
        <button id="folderBtn" class="btn" style="background:#3b82f6" onclick="document.getElementById('fileInput').click()" disabled>Load Rules Folder</button>
        <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none">
        
        <div id="docList" style="flex:1; overflow-y:auto; margin-top:10px;"></div>
    </div>

    <div class="chat-area">
        <div id="chatWindow">
            <div class="message ai-message"><b>Local AI Mode:</b> Click "Initialize Local AI Engine" to download the brain to your browser. This stays on your machine and works without a server.</div>
        </div>
        <div class="input-box" style="padding: 1rem; border-top: 1px solid #eee; display: flex; gap: 10px;">
            <input type="text" id="userInput" placeholder="Wait for AI to initialize..." style="flex:1; padding: 12px; border-radius: 20px; border:1px solid #ddd;" disabled onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" class="btn" style="width: 60px; margin: 0;" onclick="sendMessage()" disabled><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine;
    let pdfDataset = [];
    let currentDoc = null;
    const modelId = "Llama-3-8B-Instruct-v0.1-q4f32_1-MLC"; // Efficient 8B model

    window.initializeAI = async () => {
        document.getElementById('initBtn').disabled = true;
        document.getElementById('loaderUI').style.display = 'block';
        
        const initProgress = (report) => {
            const percent = Math.round(report.progress * 100);
            document.getElementById('loadFill').style.width = percent + "%";
            document.getElementById('loadMsg').innerText = report.text;
        };

        engine = await webllm.CreateMLCEngine(modelId, { initProgressCallback: initProgress });
        
        document.getElementById('engineStatus').innerText = "AI Online (Local)";
        document.getElementById('folderBtn').disabled = false;
        document.getElementById('loaderUI').style.display = 'none';
        document.getElementById('userInput').placeholder = "AI Ready. Load rules to begin.";
    };

    // --- PDF Processing ---
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.name.endsWith('.pdf'));
        const list = document.getElementById('docList');
        list.innerHTML = "Indexing...";
        
        for (let file of files) {
            const text = await extractText(file);
            const idx = pdfDataset.push({ name: file.name, content: text }) - 1;
            
            const div = document.createElement('div');
            div.className = 'doc-item';
            div.innerText = file.name;
            div.onclick = () => selectDoc(idx, div);
            list.appendChild(div);
        }
        list.firstChild.remove(); // Remove indexing text
    });

    async function extractText(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        let text = "";
        for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(it => it.str).join(" ") + " ";
        }
        return text;
    }

    window.selectDoc = (idx, el) => {
        currentDoc = pdfDataset[idx];
        document.querySelectorAll('.doc-item').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('userInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('userInput').placeholder = "Ask about " + currentDoc.name;
    };

    window.sendMessage = async () => {
        const input = document.getElementById('userInput');
        const win = document.getElementById('chatWindow');
        const query = input.value;
        if (!query) return;

        win.innerHTML += `<div class="message user-message">${query}</div>`;
        input.value = "";
        
        const messages = [
            { role: "system", content: "You are a marine engineer. Answer based on: " + currentDoc.content.substring(0, 5000) },
            { role: "user", content: query }
        ];

        const response = await engine.chat.completions.create({ messages });
        win.innerHTML += `<div class="message ai-message">${response.choices[0].message.content}</div>`;
        win.scrollTop = win.scrollHeight;
    };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
</script>
</body>
</html>
