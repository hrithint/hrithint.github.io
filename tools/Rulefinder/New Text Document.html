<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navculus Rulefinder | Hugging Face AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --navculus-green: #10b981; --bg-blue: #f1f4f9; }
        body { background: var(--bg-blue); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: white; padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .main-container { display: flex; flex: 1; overflow: hidden; padding: 1rem; gap: 1rem; }
        .sidebar { width: 320px; background: white; border-radius: 20px; padding: 1.2rem; display: flex; flex-direction: column; border: 1px solid #e2e8f0; }
        .chat-area { flex: 1; background: white; border-radius: 20px; display: flex; flex-direction: column; border: 1px solid #e2e8f0; overflow: hidden; }
        #chatWindow { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background: #f8fafc; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.5; }
        .user-message { align-self: flex-end; background: var(--navculus-green); color: white; border-bottom-right-radius: 2px; }
        .ai-message { align-self: flex-start; background: white; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; }
        .btn { border: none; border-radius: 10px; cursor: pointer; font-weight: 600; padding: 10px; width: 100%; transition: 0.2s; }
        .btn-primary { background: var(--navculus-green); color: white; margin-bottom: 10px; }
        .token-input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-ship" style="color: var(--navculus-green);"></i>
        <h2 style="margin: 0; font-size: 1.2rem;">Navculus <span style="color:var(--navculus-green)">Rulefinder</span></h2>
    </div>
    <div id="apiStatus" style="font-size: 0.8rem; color: #64748b;">Cloud AI Mode</div>
</div>

<div class="main-container">
    <div class="sidebar">
        <label style="font-size: 0.7rem; font-weight: 700; color: #64748b;">HF ACCESS TOKEN</label>
        <input type="password" id="hfToken" class="token-input" placeholder="Paste hf_token here...">
        
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-folder-open"></i> Load Rules Folder
        </button>
        <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none">
        
        <div id="docList" style="flex: 1; overflow-y: auto; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
            <p style="font-size: 0.8rem; color: #94a3b8; text-align: center;">No PDFs loaded</p>
        </div>
    </div>

    <div class="chat-area">
        <div id="chatWindow">
            <div class="message ai-message"><b>Ready for Analysis.</b><br>1. Paste your Hugging Face token on the left.<br>2. Load your folder of maritime rules.<br>3. Ask anything about vessel compliance.</div>
        </div>
        <div style="padding: 1.2rem; background: white; border-top: 1px solid #eee; display: flex; gap: 10px;">
            <input type="text" id="userInput" placeholder="Ask a question..." style="flex:1; padding:12px; border-radius:30px; border:1px solid #ddd;" onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" class="btn btn-primary" style="width: 50px; border-radius: 50%;" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDataset = [];
    let currentDoc = null;

    // --- PDF Extraction ---
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
        const list = document.getElementById('docList');
        list.innerHTML = "Indexing...";
        
        pdfDataset = [];
        for (let file of files) {
            const text = await extractText(file);
            const idx = pdfDataset.push({ name: file.name, content: text }) - 1;
            const div = document.createElement('div');
            div.style = "padding:8px; cursor:pointer; font-size:0.8rem; border-bottom:1px solid #eee;";
            div.innerText = file.name;
            div.onclick = () => {
                currentDoc = pdfDataset[idx];
                document.getElementById('chatWindow').innerHTML += `<div class="message ai-message">Now analyzing: <b>${file.name}</b></div>`;
            };
            list.appendChild(div);
        }
        if(list.firstChild.nodeType === 3) list.firstChild.remove();
    });

    async function extractText(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        let text = "";
        for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(it => it.str).join(" ") + " ";
        }
        return text;
    }

    // --- Hugging Face Inference ---
    async function sendMessage() {
        const token = document.getElementById('hfToken').value;
        const input = document.getElementById('userInput');
        const win = document.getElementById('chatWindow');
        const query = input.value.trim();

        if (!token) { alert("Please paste your Hugging Face token!"); return; }
        if (!currentDoc) { alert("Select a PDF document first!"); return; }
        if (!query) return;

        win.innerHTML += `<div class="message user-message">${query}</div>`;
        input.value = "";
        win.scrollTop = win.scrollHeight;

        try {
            document.getElementById('apiStatus').innerText = "AI Thinking...";
            
            const response = await fetch(
                "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2",
                {
                    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: `Context: ${currentDoc.content.substring(0, 3000)}\nQuestion: ${query}\nAnswer:`,
                    }),
                }
            );

            const result = await response.json();
            const fullText = result[0].generated_text;
            const answer = fullText.split("Answer:")[1] || fullText;

            win.innerHTML += `<div class="message ai-message">${answer}</div>`;
            document.getElementById('apiStatus').innerText = "Cloud AI Mode";
        } catch (err) {
            win.innerHTML += `<div class="message ai-message" style="color:red">Error: Could not reach Hugging Face. Check your token.</div>`;
        }
        win.scrollTop = win.scrollHeight;
    }
</script>
</body>
</html>
